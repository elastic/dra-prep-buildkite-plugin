# Declare your Buildkite pipelines below
---
# yaml-language-server: $schema=https://gist.githubusercontent.com/elasticmachine/988b80dae436cafea07d9a4a460a011d/raw/rre.schema.json
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: buildkite-pipeline-dra-prep-builkite-plugin
  description: Buildkite Pipeline for dra-prep-builkite-plugin
  links:
    - title: Pipeline
      url: https://buildkite.com/elastic/dra-prep-builkite-plugin

spec:
  type: buildkite-pipeline
  owner: group:artifact-management
  system: buildkite
  implementation:
    apiVersion: buildkite.elastic.dev/v1
    kind: Pipeline
    metadata:
      name: dra-prep-builkite-plugin
      description: A Buildkite plugin to prepare and upload DRA artifacts to Buildkite store
    spec:
      repository: elastic/dra-prep-builkite-plugin
      pipeline_file: ".buildkite/pipeline.yml"
      provider_settings:
        build_pull_request_forks: true
      teams:
        artifact-management:
          access_level: MANAGE_BUILD_AND_READ
        everyone:
          access_level: READ_ONLY
