# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite-plugins/buildkite-plugin-linter/master/lib/plugin-yaml-schema.yml
name: DRA Prep
description: Generate DRA build id, manifest, and summary for the artifacts produced in this step, and upload them to the Buildkite store.
author: https://github.com/elastic
configuration:
  properties:
    product_id:
      type: string
    stack_version:
      type: string
    workflow:
      type: string
      enum: [snapshot, staging]
    artifacts_dir:
      type: string
  required:
    - product_id
    - stack_version
    - workflow
    - artifacts_dir
  additionalProperties: false
