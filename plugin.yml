name: DRA Prep
description: Generate DRA build id, manifest, and summary for the artifacts produced in this step, and upload them to the Buildkite store.
author: https://github.com/elastic
requirements: []
configuration:
  properties:
    product_id:
      type: string
      description: "Product identifier, e.g. 'apm-server'"
    stack_version:
      type: string
      description: "Stack version, e.g. '9.5.0-SNAPSHOT'"
    workflow:
      type: string
      enum: [snapshot, staging]
      description: "Target workflow: 'snapshot' or 'staging'"
    artifacts_dir:
      type: string
      description: "Path to the directory containing build artifacts to include in the manifest"
  required:
    - product_id
    - stack_version
    - workflow
    - artifacts_dir
  additionalProperties: false
# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite-plugins/buildkite-plugin-linter/master/lib/plugin-yaml-schema.yml
