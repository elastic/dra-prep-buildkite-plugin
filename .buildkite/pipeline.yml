---
# $yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
steps:

  # if our Renovate configuration is amended, then make sure we have well-formed config
  # for more info, see https://docs.elastic.dev/plat-prod-team/service-catalogue/renovate/testing-renovate-changes
  - label: "Verify Renovate configuration"
    command: "renovate-config-validator"
    agents:
      image: "docker.elastic.co/ci-agent-images/pipelib:0.27.0@sha256:d1713778d27e0b6208f59ba8761f04ef033af4c4237cb2614a09d38584c5ff88"
    if_changed:
      - "renovate.json"

  # if our catalog-info.yaml is changed, make sure it's well-formed according to our internal standards as well as Backstage's validation
  - label: Validate TokenPolicy RREs
    command: "/agent/check-catalog-info.sh"
    agents:
      image: "docker.elastic.co/ci-agent-images/pipelib:0.27.0@sha256:d1713778d27e0b6208f59ba8761f04ef033af4c4237cb2614a09d38584c5ff88"
    if_changed:
      - "catalog-info.yaml"

  - label: ":shell: Lint"
    command: "bin/shellcheck hooks/post-command"
    agents:
      provider: "gcp"
      image: family/core-ubuntu-2204
    if_changed:
      include:
        - "**/*"
      exclude:
        - "catalog-info.yaml"
        - "renovate.json"

  - label: ":test_tube: Test"
    command: "bin/bats tests/"
    agents:
      provider: "gcp"
      image: family/core-ubuntu-2204
    if_changed:
      include:
        - "**/*"
      exclude:
        - "catalog-info.yaml"
        - "renovate.json"

  - label: ":buildkite: Validate plugin"
    plugins:
      - plugin-linter#v3.3.0:
          id: elastic/dra-prep
    agents:
      provider: "gcp"
      image: family/core-ubuntu-2204
    if_changed:
      include:
        - "**/*"
      exclude:
        - "catalog-info.yaml"
        - "renovate.json"
