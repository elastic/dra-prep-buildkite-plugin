---
# Smoke-test pipeline for manual validation of the plugin from the branch.
# Trigger with: bk build create --pipeline dra-prep-buildkite-plugin-smoke-test
# Or: buildkite-agent pipeline upload .buildkite/smoke-test.yml
#
# Requires the pipeline to have elastic/dractl in its GithubPermissionSet
# so that VAULT_GITHUB_TOKEN is available for the dractl binary download.
steps:
  - label: ":smoke: Smoke test plugin (branch)"
    command: |
      mkdir -p dra/smoke-test
      touch dra/smoke-test/smoke-test-9.5.0-SNAPSHOT-linux-x86_64.tar.gz
    plugins:
      - elastic/dra-prep-buildkite-plugin#wire/dractl-prep:
          product_id: smoke-test
          stack_version: "9.5.0-SNAPSHOT"
          workflow: snapshot
    agents:
      image: "docker.elastic.co/ci-agent-images/ubuntu-build-essential:latest@sha256:f25d024a1b9e2490c6201a2ef9822d73e604911e1a616d0f2b02537e5176f66c"
